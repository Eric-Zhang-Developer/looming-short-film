<!doctype html>
<meta charset="utf-8">
<title>s04 measure</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module">
  // anim-s04 measurement rig (smoke-paper method): builds src/shots/s04.js on its own stage (no post). The blob's wall
  // shadow = pixels that change when the blob stops casting; the blob = its own pixels rendered alone on white. Both are
  // back-projected onto their planes (wall z 0, blob z) and compared box to box.
  import * as THREE from 'three';
  import { createStage, exposeForRender } from '/src/core/stage.js';
  import { PALETTE } from '/src/core/palette.js';
  import * as assets from '/src/assets.js';
  import { build } from '/src/shots/s04.js';

  const stage = createStage(), { renderer, scene, camera } = stage;
  const shot = await build({ stage, scene, camera, renderer, assets, PALETTE, post: () => ({ set() {} }) });
  stage.onFrame((t) => shot.update(t));
  exposeForRender(stage, { duration: 8 });
  const gl = renderer.getContext(), W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
  const grab = () => { renderer.render(scene, camera); const p = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, p); return p; };
  const luma = (p, i) => 0.2126 * p[i * 4] + 0.7152 * p[i * 4 + 1] + 0.0722 * p[i * 4 + 2];
  function diff(meshes, thr = 6) {  // pixels that get lighter when `meshes` stop casting
    const a = grab(); meshes.forEach((m) => { m.castShadow = false; }); const b = grab(); meshes.forEach((m) => { m.castShadow = true; });
    const m = new Uint8Array(W * H); let n = 0;
    for (let i = 0; i < W * H; i++) if (luma(b, i) - luma(a, i) > thr) { m[i] = 1; n++; }
    return { m, n };
  }
  function blobAlone() {
    const vis = new Map(); scene.traverse((o) => vis.set(o, o.visible));
    scene.children.forEach((o) => { o.visible = !!o.isLight; }); shot.exam.mesh.visible = true;
    const bg = scene.background; scene.background = new THREE.Color(1, 1, 1);
    const p = grab(); scene.background = bg; vis.forEach((v, o) => { o.visible = v; });
    const m = new Uint8Array(W * H); for (let i = 0; i < W * H; i++) m[i] = luma(p, i) < 128 ? 1 : 0;
    return m;
  }
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3();
  function box(m, z) {  // back-projected bounding box on the plane z, in meters
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -z);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, n = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!m[y * W + x]) continue; n++;
      ndc.set((x + 0.5) / W * 2 - 1, (y + 0.5) / H * 2 - 1); ray.setFromCamera(ndc, camera); ray.ray.intersectPlane(plane, hit);
      x0 = Math.min(x0, hit.x); x1 = Math.max(x1, hit.x); y0 = Math.min(y0, hit.y); y1 = Math.max(y1, hit.y);
    }
    return { x0, x1, y0, y1, w: x1 - x0, h: y1 - y0, n };
  }
  window.measure = (t) => {
    window.renderFrame(t);
    // The blob also shades the stool 1 mm behind it; that contact shadow is not on the wall, so the blob's own screen
    // box (40 px wider, down to the frame bottom: the stool) is left out of the shadow mask.
    const bm = blobAlone(), bz = shot.exam.mesh.position.z, blob = box(bm, bz), d = diff([shot.exam.mesh]).m;
    let sx0 = W, sx1 = 0, sy1 = 0;
    for (let i = 0; i < W * H; i++) if (bm[i]) { const x = i % W, y = (i / W) | 0; sx0 = Math.min(sx0, x); sx1 = Math.max(sx1, x); sy1 = Math.max(sy1, y); }
    for (let y = 0; y <= sy1 + 40; y++) for (let x = Math.max(0, sx0 - 40); x <= Math.min(W - 1, sx1 + 40); x++) d[y * W + x] = 0;
    const sh = box(d, 0);
    return { t, bz, blob, shadow: sh, scaleW: sh.w / blob.w, scaleH: sh.h / blob.h };
  };
  // Pixel boxes (top-left origin) for light.mjs: his head's center, a key-lit cabinet door right of every shadow position and
  // the shadow's interior on the next door (below its eyes).
  window.points = (t) => {
    window.renderFrame(t);
    const px = (p) => { const v = p.clone().project(camera); return [Math.round((v.x + 1) / 2 * W), Math.round((1 - v.y) / 2 * H)]; };
    const head = new THREE.Vector3(); shot.rig.meshes.head.getWorldPosition(head);
    return { head: px(head), lit: px(new THREE.Vector3(-0.06, 0.12, 0.004)), shadow: px(new THREE.Vector3(-0.278, 0.13, 0.004)) };
  };
  window.student = (t) => {  // wall pixels the Student's shadow changes (all his parts stop casting)
    window.renderFrame(t);
    const meshes = Object.values(shot.rig.meshes), d = diff(meshes);
    return { t, changed: d.n, box: d.n ? box(d.m, 0) : null };
  };
</script>
