<!doctype html>
<meta charset="utf-8">
<title>s12 measure</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/examples/jsm/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module">
  // anim-s12 measurement rig: builds src/shots/s12.js on its own stage (no post, so pixels are the lit scene) and reads
  // back pixels at projected world points. Used by measure.mjs. Times are s12-local.
  import * as THREE from 'three';
  import { createStage, exposeForRender } from '/src/core/stage.js';
  import { PALETTE } from '/src/core/palette.js';
  import * as assets from '/src/assets.js';
  import { build } from '/src/shots/s12.js';

  const stage = createStage(), { renderer, scene, camera } = stage;
  const shot = await build({ stage, scene, camera, renderer, assets, PALETTE, post: () => ({ set() {} }) });
  stage.onFrame((t) => shot.update(t));
  exposeForRender(stage, { duration: 10 });
  window.__s = { scene, camera, renderer }; window.__T = THREE;
  const gl = renderer.getContext(), W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
  let px = null, pxNo = null;
  const read = () => { const b = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, b); return b; };
  const project = (p) => { const v = new THREE.Vector3(...p).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
  const lumOf = (buf, [x, y]) => { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= W || y >= H) return NaN;
    const i = ((H - 1 - y) * W + x) * 4; return (0.2126 * buf[i] + 0.7152 * buf[i + 1] + 0.0722 * buf[i + 2]) / 255; };
  const blobMesh = (() => { let b = null; scene.traverse((o) => { if (o.name === 'blob') b = o; }); return b; })();
  window.frame = (t) => { stage.renderFrame(t); px = read(); return shot.probe(); };
  // same t rendered with the blob hidden: the difference is the blob's own shadow (and the blob)
  window.frameBoth = (t) => { const p = window.frame(t); const keep = px; blobMesh.visible = false; stage.renderFrame(t); pxNo = read(); blobMesh.visible = true; px = keep; return p; };
  window.project = project;
  window.scanBoth = (a, b, n) => Array.from({ length: n + 1 }, (_, i) => {
    const w = a.map((v, j) => v + (b[j] - v) * i / n), q = project(w); return [w[0], lumOf(px, q), lumOf(pxNo, q)]; });
  window.lumAvg = (w, r) => { const [cx, cy] = project(w); let s = 0, n = 0;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) { const l = lumOf(px, [cx + x, cy + y]); if (!isNaN(l)) { s += l; n++; } } return s / n; };
  window.meanLum = () => { let s = 0; for (let i = 0; i < px.length; i += 4) s += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]; return s / (px.length / 4) / 255; };
</script>
