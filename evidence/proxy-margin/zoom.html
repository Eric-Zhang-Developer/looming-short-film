<!doctype html>
<meta charset="utf-8">
<title>proxy-margin · edge zoom</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<!-- Evidence page, not film. Same layout as evidence/mod-film/proxies.html, but every piece goes through makePaper, so
     the edges you see are the torn ones. Labels never reach a frame. -->
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module">
  import * as assets from '/src/assets.js';
  import { makePaper } from '/src/paper.js';
  const c = Object.assign(document.createElement('canvas'), { width: 1920, height: 1100 }), g = c.getContext('2d');
  document.body.appendChild(c);
  // The torn sheet as pixels: map color, alpha from alphaMap.
  function flat(sheet) {
    const m = sheet.map.image, a = sheet.alphaMap.image, w = m.width, h = m.height;
    const t = Object.assign(document.createElement('canvas'), { width: w, height: h }), x = t.getContext('2d');
    x.drawImage(m, 0, 0); const d = x.getImageData(0, 0, w, h);
    x.clearRect(0, 0, w, h); x.drawImage(a, 0, 0); const ad = x.getImageData(0, 0, w, h).data;
    for (let i = 0; i < w * h; i++) d.data[i * 4 + 3] = ad[i * 4];
    x.putImageData(d, 0, 0); return t;
  }
  const ready = (async () => {
    g.fillStyle = '#3a3f55'; g.fillRect(0, 0, c.width, c.height);
    const sel = [['skyline_sheet','skyline_far'],['apt_exterior','facade'],['marston_stacks','shelf_1'],['calendar','sheet1'],['face_sheet','mouth_line'],['desk_lamp','stem']];
    for (const [i, [name, p]] of sel.entries()) {
      const a = await assets.load(name), sheet = makePaper({ art: a.pieces[p], size: a.sizes[p], key: `ev|${name}|${p}`, res: 1024 }), t = flat(sheet);
      const x = (i % 3) * 640, y = Math.floor(i / 3) * 550, cw = Math.min(300, t.width), ch = Math.min(250, t.height), s = 2;  // top-left corner of the 1024-px sheet at 200%
      g.drawImage(t, 0, 0, cw, ch, x + 20, y + 10, cw * s, ch * s);
      g.fillStyle = '#ddd'; g.font = '14px sans-serif'; g.fillText(`${name}/${p}  corner, 200%`, x + 20, y + 535);
    }
  })();
  window.renderFrame = async () => { await ready; };
  window.LOOMING = { duration: 1, fps: 24, ready };
</script>
